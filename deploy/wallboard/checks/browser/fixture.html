<!doctype html><meta charset="utf-8"><title>Wallboard runtime test fixture</title>
<link rel="stylesheet" href="/crates/fwd-web/src/app.css">
<link rel="stylesheet" href="/crates/fwd-web/src/wallboard/wallboard.css">
<main class="wallboard"><div class="wallboard-graph" role="img" aria-label="Task graph"></div>
<span class="wallboard-connection" role="status" data-connected="true">Live</span></main>
<script type="module">
import { WallboardRuntime } from '/crates/fwd-web/src/wallboard/wallboard-runtime.mjs';
import { readSnapshot } from '/crates/fwd-web/src/wallboard/wallboard-history.mjs';
const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const settings = { project_id: 'fixture-project', statuses: ['open','in_progress','in_review','proposed'],
  max_rows: 8, node_width: 440, replay: { enabled: true, interval_seconds: 180 } };
let layout = input => {
  const {nodes,edges,node_width,max_rows} = JSON.parse(input);
  const columns = new Map(nodes.map(node => [node.id, 0]));
  for (let i = 0; i < nodes.length; i++) for (const edge of edges)
    columns.set(edge.to, Math.min(nodes.length, Math.max(columns.get(edge.to), columns.get(edge.from) + 1)));
  const occupied = [], boxes = [];
  for (const node of nodes) {
    let c = columns.get(node.id);
    while ((occupied[c] || 0) >= max_rows) c++;
    const row = occupied[c] || 0; occupied[c] = row + 1;
    boxes.push({ id: node.id, x: 24 + c * (node_width + 300), y: 24 + row * 165 });
  }
  const byId = new Map(boxes.map(box => [box.id,box]));
  const routes = edges.map(edge => { const a = byId.get(edge.from), b = byId.get(edge.to);
    return [[a.x + node_width, a.y + 74.5], [b.x, b.y + 74.5]]; });
  return JSON.stringify({ boxes, routes, width: Math.max(488,...boxes.map(b => b.x + node_width + 24)),
    height: Math.max(197,...boxes.map(b => b.y + 173)) });
};
const snapshot = (tasks, edges = []) => {
  const scale = (settings.text_scale_percent || 100) / 100;
  const width = settings.node_width * scale, height = 149 * scale;
  // The request the runtime makes of each card it reads back from a frame (`arrange`).
  const nodes = tasks.map(task => ({ id: task.id, title: task.title, priority: task.priority ?? 2, status: task.status || 'open', height }));
  const placed = JSON.parse(layout(JSON.stringify({ nodes, edges, max_rows: settings.max_rows, node_width: width })));
  const svg = ['<svg xmlns="http://www.w3.org/2000/svg" class="dag wallboard-dag" viewBox="0 0 '+placed.width+' '+placed.height+'"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs>'];
  for (let i=0;i<edges.length;i++) {
    const [[x,y],[bx,by]]=placed.routes[i], m=(x+bx)/2;
    svg.push(`<path class="edge edge-depends" marker-end="url(#arrow)" data-from="${escape(edges[i].from)}" data-to="${escape(edges[i].to)}" data-route="${escape(JSON.stringify(placed.routes[i]))}" d="M${x},${y} C${m},${y} ${m},${by} ${bx},${by}"/>`);
  }
  for (let i=0;i<tasks.length;i++) {
    const task=tasks[i], box=placed.boxes[i], p=task.priority??2;
    svg.push(`<g class="node wallboard-node status-${task.status||'open'} priority-p${Math.min(3,p)}${task.availability?.some(label=>['Blocked','On hold'].includes(label))?' availability-waiting':''}" data-id="${escape(task.id)}" data-layout-title="${escape(task.title)}" data-priority="${p}" data-revision="${escape(task.revision||JSON.stringify(task))}" transform="translate(${box.x},${box.y})"><title>${escape(task.title)}</title><rect class="wallboard-card" width="${width}" height="${height}" rx="9"/><text class="title" x="12" y="28">${escape(task.title)}</text><text class="wallboard-what" x="12" y="79">${escape(task.what||'Actual task WHAT stays visible.')}</text>${(task.availability||[]).map((label,i)=>`<g class="wallboard-availability" transform="translate(${12+i*90},90)"><rect width="84" height="21" rx="10"/><text x="9" y="15">${escape(label)}</text></g>`).join('')}<g class="wallboard-scope" transform="translate(12,114)"><rect width="130" height="21" rx="10"/><text x="9" y="15">Test scope</text></g><text class="sub" x="154" y="129">${task.status||'open'}</text><g class="wallboard-priority p${Math.min(3,p)}" transform="translate(392,114)"><rect width="36" height="21" rx="5"/><text x="18" y="15" text-anchor="middle">P${p}</text></g></g>`);
  }
  return svg.join('')+'</svg>';
};
let runtime;
const reset = () => { runtime?.dispose(); runtime = new WallboardRuntime(document.querySelector('.wallboard-graph'),settings,layout); return runtime; };
reset();
window.fixture = { get runtime() { return runtime; }, snapshot, reset, settings, get layout() { return layout; }, useLayout(value) { layout = value; }, readSnapshot };
</script>
