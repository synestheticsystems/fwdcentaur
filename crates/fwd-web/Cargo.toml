[package]
name = "fwd-web"
description = "fwdcentaur web UI: a Leptos app served by the daemon; an ephemeral Ankurah node in the browser"
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

# Its own workspace: this crate only ever targets wasm32-unknown-unknown (trunk builds it into
# dist/, which `fwd` embeds), so the root workspace excludes it and `cargo build --workspace`
# there stays native. Pins match the root workspace's Ankurah version exactly.
[workspace]

[features]
# The wallboard (docs/design/wallboard.md): the kiosk display of one project's graph, built from
# wallboard.html by scripts/build-wallboard.sh in place of the app. The page the daemon embeds is
# built without it.
wallboard = ["dep:serde", "dep:unicode-width"]

[dependencies]
fwd-core = { path = "../fwd-core", default-features = false, features = ["wasm"] }
ankurah = { git = "https://github.com/ankurah/ankurah", rev = "5d8a000ba9b1375be9307e2aab6887886be35dda", features = ["derive", "wasm"] }
# Leptos reads Ankurah signals through the reactive_graph bridge (ReactiveGraphObserver), not
# the React bindings: never turn on `ankurah/react` here.
ankurah-signals = { git = "https://github.com/ankurah/ankurah", rev = "5d8a000ba9b1375be9307e2aab6887886be35dda", features = ["reactive-graph"] }
ankurah-websocket-client-wasm = { git = "https://github.com/ankurah/ankurah", rev = "5d8a000ba9b1375be9307e2aab6887886be35dda" }
ankurah-storage-indexeddb-wasm = { git = "https://github.com/ankurah/ankurah", rev = "5d8a000ba9b1375be9307e2aab6887886be35dda" }
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# So that a thread's query stops waiting for the daemon's answer once the query closes
# (`thread::Live`); Ankurah and Leptos already build on it.
futures = "0.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Location", "Document", "Element", "Node", "EventTarget", "HtmlElement", "Response", "Storage",
    "UrlSearchParams", "KeyboardEvent", "HtmlTextAreaElement", "HtmlInputElement", "ScrollIntoViewOptions",
    "ScrollLogicalPosition", "SpeechSynthesis", "SpeechSynthesisUtterance", "SpeechSynthesisVoice",
    "Navigator", "Clipboard", "HtmlDocument", "Event", "CustomEvent", "CustomEventInit", "HtmlSelectElement",
    "DomRect", "MouseEvent", "PointerEvent", "UiEvent", "FocusEvent", "MediaQueryList", "CssStyleDeclaration",
] }
send_wrapper = "0.6"
# The wallboard reads its runtime's layout requests as typed values, so that one no frame could give
# is refused.
serde = { version = "1", features = ["derive"], optional = true }
# The wallboard reckons the columns a character takes by its East Asian Width; the CJK tables, which
# count ambiguous characters wide, it never reads.
unicode-width = { version = "0.2", default-features = false, optional = true }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-wasm = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
