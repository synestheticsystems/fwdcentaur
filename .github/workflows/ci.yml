name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    # cargo test --workspace takes about three minutes here and the whole job about thirteen; on 2026-09-30 a test waited for good and the job ran on toward the six-hour limit until cancelled (run 36783874154).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The toolchain rust-toolchain.toml pins, so that CI and a developer's machine run the same
      # clippy; the action takes the channel as an input, so it is read from the file first.
      - id: pin
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/fwd-web
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: 'v0.21.14'
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check --manifest-path crates/fwd-web/Cargo.toml
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --manifest-path crates/fwd-web/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --manifest-path crates/fwd-web/Cargo.toml --target wasm32-unknown-unknown --features wallboard -- -D warnings
      - run: cargo test --workspace
      # The web crate's own tests run natively, without the wallboard and with it (docs/design/wallboard.md).
      - run: cargo test --manifest-path crates/fwd-web/Cargo.toml
      - run: cargo test --manifest-path crates/fwd-web/Cargo.toml --features wallboard
      - run: python3 -m unittest discover -s deploy/wallboard/checks/launcher -p 'test_*.py' -v   # the wallboard's launcher and its settings contract
      - run: python3 -m unittest discover -s scripts -p 'test_wallboard_*.py' -v   # the wallboard build's identity covers what Cargo reads for it and names only a dist built under it, its notice what it compiles in, and an official build refuses the flags that would undo its remapping
      - run: bash scripts/build-web.sh   # the web UI into crates/fwd-web/dist; the next build embeds it
      - run: cargo build --workspace
      - run: bash scripts/smoke-roles.sh   # the fixed roles through the CLI against a scratch workspace; checks the served UI
  # The wallboard's runtime in Node and its browser checks in Playwright's Chromium, against the
  # production WASM that scripts/build-wallboard.sh builds, all on synthetic data: nothing here reaches
  # a daemon. On a person's machine scripts/check-wallboard.py runs these and the rust job's wallboard
  # checks together.
  wallboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The toolchain rust-toolchain.toml pins, read from the file as the rust job reads it.
      - id: pin
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fwd-web
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: 'v0.21.14'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/wallboard/checks/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: deploy/wallboard/checks
      # Playwright's pinned Chromium, with the system libraries it needs.
      - run: npx playwright install --with-deps chromium
        working-directory: deploy/wallboard/checks
      # Built as an official build is, with the builder's paths taken out of the WebAssembly: the
      # build fails if any is left in it.
      - run: WALLBOARD_REMAP_PATHS=1 bash scripts/build-wallboard.sh
      - run: node --test deploy/wallboard/checks/*/test-*.mjs
      - run: for check in deploy/wallboard/checks/browser/test-*.cjs; do node "$check"; done
  # The VS Code extension's suite (extensions/vscode, `npm test`) with VS Code on a virtual display,
  # as scripts/test-extension-headless.sh runs it in its container on a person's machine.
  extension:
    runs-on: ubuntu-latest
    # A run of the suite takes under twenty minutes, three launches included (scripts/test-extension-headless.sh); a job past an hour is stuck, not slow.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # crates/fwd-host takes ankurah-storage-sqlite-node by path from ../ankurah-storage-node-sqlite,
      # Daniel's Ankurah worktree on the branch feat/storage-node-sqlite-wasm, and no public Ankurah
      # ref carries that crate yet. This clones the branch there from GitHub; until the branch is on
      # GitHub with the crate, the job says so in a notice and runs nothing more. Once fwd-host takes
      # every Ankurah crate from git (its Cargo.toml says when), nothing needs cloning.
      #
      # fwd-host builds fwd-core against that branch's Ankurah, so the branch must hold the Ankurah
      # revision the workspace pins. While it does not, fwd-core cannot compile there and the
      # extension is out of service (docs/DECISIONS.md, D172): the job says so in a notice and runs
      # nothing more, and runs again by itself once the branch holds the pin.
      - id: deps
        run: |
          pinned=$(sed -n 's/^ankurah  *= .*rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml)
          [ -n "$pinned" ] || { echo "::error::Cargo.toml names no Ankurah revision for the workspace"; exit 1; }
          branch=../ankurah-storage-node-sqlite
          if ! grep -q '"\.\./\.\./\.\./ankurah-storage-node-sqlite/' crates/fwd-host/Cargo.toml; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif ! { git clone --quiet --filter=blob:none --branch feat/storage-node-sqlite-wasm https://github.com/ankurah/ankurah "$branch" &&
                   [ -d "$branch/storage/sqlite-node" ]; }; then
            echo "::notice title=VS Code extension suite not run::crates/fwd-host takes ankurah-storage-sqlite-node by path from ../ankurah-storage-node-sqlite, and github.com/ankurah/ankurah has no branch feat/storage-node-sqlite-wasm with storage/sqlite-node yet"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif ! git -C "$branch" merge-base --is-ancestor "$pinned" HEAD 2>/dev/null; then
            echo "::notice title=VS Code extension suite not run::the extension is out of service (docs/DECISIONS.md, D172): crates/fwd-host builds fwd-core against Ankurah's branch feat/storage-node-sqlite-wasm, which does not hold Ankurah $pinned, the revision the workspace pins"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      # The toolchain rust-toolchain.toml pins, read from the file as the rust job reads it.
      - if: steps.deps.outputs.ready == 'true'
        id: pin
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - if: steps.deps.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - if: steps.deps.outputs.ready == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/fwd-web
            crates/fwd-host
      # trunk and wasm-pack at the versions scripts/test-extension-headless.Dockerfile installs.
      - if: steps.deps.outputs.ready == 'true'
        uses: jetli/trunk-action@v0.5.0
        with:
          version: 'v0.21.14'
      - if: steps.deps.outputs.ready == 'true'
        run: |
          curl -sSfL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.14.0/wasm-pack-v0.14.0-x86_64-unknown-linux-musl.tar.gz |
            tar -xz -C ~/.cargo/bin --strip-components=1 wasm-pack-v0.14.0-x86_64-unknown-linux-musl/wasm-pack
      # Node 24, which VS Code runs extensions on.
      - if: steps.deps.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - if: steps.deps.outputs.ready == 'true'
        run: command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
      - if: steps.deps.outputs.ready == 'true'
        run: bash scripts/test-extension-headless.sh --here
